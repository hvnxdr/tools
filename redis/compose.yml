services:
  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "password"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
